---
# ── Stack settings ────────────────────────────────────────────────────────────
# Host port exposed by Caddy (must match the hostPort in kube/stack.yml.j2)
llm_web_port: 8080

# Networks allowed to reach llm_web_port, as IP addresses or CIDR blocks, e.g.
# ["192.168.1.0/24", "100.64.0.0/10"]. Empty opens the port to every source.
llm_allowed_networks: []

# Host names and IP addresses clients use to reach the stack. When set,
# Caddy serves HTTPS on llm_web_port with certificates for these names (and
# localhost) from its own local CA; clients must trust that CA (see README).
# Empty keeps plain HTTP.
llm_tls_hostnames: []

# Directory containing the llm-companion project files on the TARGET host.
# The Ollama image is built from the Dockerfile here, and the helper scripts
# are installed from here.
llm_project_dir: "{{ ansible_facts['user_dir'] }}/llm-companion"

# This repository on the CONTROL node, where kube/stack.yml.j2 and
# caddy/Caddyfile are read to render the stack manifest.
llm_repo_dir: "{{ playbook_dir }}/.."

# ── Backups ──────────────────────────────────────────────────────────────────
# When a playbook run changes the stack, the Open WebUI data volume (users,
# chats, settings) is exported here before the service restarts. Only the
# newest llm_backup_keep archives are kept.
llm_backup_dir: "{{ ansible_facts['user_dir'] }}/llm-companion-backups"
llm_backup_keep: 3

# ── Model pulling ────────────────────────────────────────────────────────────
# Set to true to have Ansible start the stack and pull models automatically.
# Requires the service to be startable (i.e. not a cloud-init first-boot run).
llm_pull_models: false

# ── Ollama build ──────────────────────────────────────────────────────────────
# Build target: 'cpu', 'rocm', or 'cuda'.
# This is the fallback default. scripts/setup-host.sh normally supplies a
# per-host override via ansible/inventory/host_vars/<hostname>.yml based on
# detected hardware — see scripts/detect-hardware.sh.
ollama_build_target: cpu
# ROCm only: HSA_OVERRIDE_GFX_VERSION for GPUs ROCm does not support directly
# (e.g. "11.0.0" for RDNA3). Find your GPU with: rocminfo | grep gfx
ollama_hsa_override_gfx_version: ""
# Image tag after build
ollama_image_tag: "ollama-{{ ollama_build_target }}:latest"
