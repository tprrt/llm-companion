---
# ── Install Podman and build tools ───────────────────────────────────────────
- name: Install Podman, buildah, and networking tools (RedHat)
  ansible.builtin.dnf:
    name:
      - podman
      - buildah
      - passt
      - slirp4netns
    state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# ── Install Podman and build tools (Debian) ──────────────────────────────────
# Debian 13 ships Podman 5.x natively; no third-party repository is required.
- name: Install Podman and buildah (Debian)
  ansible.builtin.apt:
    name:
      - podman
      - buildah
      - slirp4netns
      - fuse-overlayfs
    state: present
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

# ── Debian: cgroupfs manager + overlay storage driver ────────────────────────
# When Podman runs inside cloud-init (no systemd user session), crun tries to
# reach D-Bus for cgroup management and hits a polkit permission error.
# Setting cgroup_manager = "cgroupfs" bypasses D-Bus entirely.
#
# Rootless Podman on Debian defaults to the VFS storage driver, which makes a
# full filesystem copy per layer and rapidly fills the disk. fuse-overlayfs
# provides a proper overlay driver for rootless containers.
- name: Configure Podman engine (Debian)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/containers.conf"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"
    mode: "0644" # NOSONAR — non-sensitive Podman engine config; world-readable is intentional
  when: ansible_facts['os_family'] == "Debian"

- name: Configure Podman storage to use fuse-overlayfs (Debian)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/containers/storage.conf"
    content: |
      [storage]
      driver = "overlay"

      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"
    mode: "0644" # NOSONAR — non-sensitive Podman storage config; world-readable is intentional
  when: ansible_facts['os_family'] == "Debian"

# ── SELinux boolean (RedHat only) ─────────────────────────────────────────────
- name: Check SELinux boolean container_manage_cgroup (RedHat)
  ansible.builtin.command:
    cmd: getsebool container_manage_cgroup
  when: ansible_facts['os_family'] == "RedHat"
  register: podman_sebool_check
  changed_when: false

- name: Enable SELinux boolean container_manage_cgroup (RedHat)
  ansible.builtin.command:
    cmd: setsebool -P container_manage_cgroup on
  become: true
  when: ansible_facts['os_family'] == "RedHat" and 'on' not in podman_sebool_check.stdout
  changed_when: true

# ── Podman user socket ────────────────────────────────────────────────────────
- name: Enable Podman user socket
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    state: started
    enabled: true

# ── NVIDIA Container Toolkit (CUDA only) ──────────────────────────────────────
# Podman's CDI (Container Device Interface) support needs the toolkit to
# generate /etc/cdi/nvidia.yaml before kube/stack-cuda.yml's
# resources.limits."nvidia.com/gpu=all" request can resolve to a real device.
# Assumes the NVIDIA driver itself (nvidia-smi) is already installed by the
# operator — same assumption already made for ROCm packages above.
- name: Add NVIDIA Container Toolkit repo (RedHat)
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    mode: "0644" # NOSONAR — standard repo file, world-readable is intentional
  become: true
  when: ollama_build_target == 'cuda' and ansible_facts['os_family'] == "RedHat"

- name: Add NVIDIA Container Toolkit GPG key (Debian)
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    mode: "0644" # NOSONAR — standard GPG key file, world-readable is intentional
  become: true
  when: ollama_build_target == 'cuda' and ansible_facts['os_family'] == "Debian"

- name: Add NVIDIA Container Toolkit repo (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.asc] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
    filename: nvidia-container-toolkit
    state: present
  become: true
  when: ollama_build_target == 'cuda' and ansible_facts['os_family'] == "Debian"

- name: Install nvidia-container-toolkit (RedHat)
  ansible.builtin.dnf:
    name: nvidia-container-toolkit
    state: present
  become: true
  when: ollama_build_target == 'cuda' and ansible_facts['os_family'] == "RedHat"

- name: Install nvidia-container-toolkit (Debian)
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  become: true
  when: ollama_build_target == 'cuda' and ansible_facts['os_family'] == "Debian"

- name: Check if a CDI spec already exists for NVIDIA
  ansible.builtin.stat:
    path: /etc/cdi/nvidia.yaml
  register: podman_nvidia_cdi_check
  when: ollama_build_target == 'cuda'

- name: Generate CDI spec for NVIDIA GPUs
  ansible.builtin.command:
    cmd: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  become: true
  when: ollama_build_target == 'cuda' and not podman_nvidia_cdi_check.stat.exists
  changed_when: true

- name: Verify the CDI spec exposes an all-GPUs device
  ansible.builtin.command:
    cmd: grep -q "nvidia.com/gpu=all" /etc/cdi/nvidia.yaml
  when: ollama_build_target == 'cuda'
  changed_when: false

# ── Build Ollama image ────────────────────────────────────────────────────────
- name: Check if Ollama image already exists
  ansible.builtin.command:
    cmd: podman image exists {{ ollama_image_tag }}
  register: podman_ollama_image_check
  failed_when: false
  changed_when: false

- name: Build Ollama image from project directory
  ansible.builtin.command:
    cmd: podman build --target {{ ollama_build_target }} -t {{ ollama_image_tag }} {{ llm_project_dir }}
  register: podman_ollama_build_result
  changed_when: podman_ollama_build_result.rc == 0
  when: podman_ollama_image_check.rc != 0
