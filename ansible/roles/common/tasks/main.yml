---
- name: Create ~/.config/containers/systemd directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/containers/systemd"
    state: directory
    mode: "0755" # NOSONAR — non-sensitive container systemd directory; world-readable is intentional

- name: Create ~/.config/ollama directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/ollama"
    state: directory
    mode: "0700"

- name: Check if loginctl linger is enabled
  ansible.builtin.command:
    cmd: loginctl show-user {{ ansible_facts['user_id'] }} --property=Linger
  register: common_linger_check
  changed_when: false
  failed_when: false

- name: Enable loginctl linger for the connecting user
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ ansible_facts['user_id'] }}
  become: true
  when: "'Linger=yes' not in common_linger_check.stdout"
  changed_when: true

- name: Check if subuid entry already exists for the user
  ansible.builtin.command:
    cmd: grep -q "^{{ ansible_facts['user_id'] }}:" /etc/subuid
  register: common_subuid_check
  failed_when: false
  changed_when: false

- name: Add subuid/subgid entries for rootless Podman
  ansible.builtin.command:
    cmd: usermod --add-subuids 100000-165535 --add-subgids 100000-165535 {{ ansible_facts['user_id'] }}
  become: true
  when: common_subuid_check.rc != 0
  changed_when: true
