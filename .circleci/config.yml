# =============================================================================
# CircleCI pipeline — static validation for the llm-companion stack
#
# Workflow:
#   validate-changes — all branches except gh-pages: lint + validate jobs
#
# Jobs:
#   sonarcloud-scan      — static analysis with SonarCloud
#   shellcheck           — lint shell scripts with ShellCheck
#   hadolint             — lint Dockerfile with Hadolint
#   caddy-validate       — check Caddyfile formatting and syntax
#   ansible-lint         — lint Ansible playbooks
#   kube-validate        — render kube/stack.yml.j2 per build target, validate with kubeconform
#   test-pull-models     — check pull-models.sh picks the expected models per hardware
#   check-spdx           — verify every source file carries an SPDX header
# =============================================================================

version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@4.1.0

# ---------------------------------------------------------------------------
# Shared filter — run on all branches except gh-pages
# ---------------------------------------------------------------------------
x-ignore-gh-pages: &ignore-gh-pages
  filters:
    branches:
      ignore:
        - gh-pages

executors:
  docker-shellcheck:
    docker:
      - image: koalaman/shellcheck-alpine:v0.11.0
    resource_class: small
  docker-hadolint:
    docker:
      - image: hadolint/hadolint:v2.15.1-alpine
    resource_class: small
  docker-caddy:
    docker:
      # Keep in sync with the caddy version pinned in the kube/stack*.yml
      # manifests, so `caddy validate` here reflects what actually
      # runs in production.
      - image: caddy:2.11.9-alpine
    resource_class: small
  docker-alpine:
    docker:
      - image: alpine:3.24.4
    resource_class: small
  docker-sonarcloud:
    docker:
      - image: cimg/node:26.13.1
    resource_class: medium

jobs:

  # ---------------------------------------------------------------------------
  # sonarcloud-scan — static analysis with SonarCloud
  # ---------------------------------------------------------------------------
  sonarcloud-scan:
    executor: docker-sonarcloud
    steps:
      - checkout
      - sonarcloud/scan

  # ---------------------------------------------------------------------------
  # shellcheck — static analysis for all Bash scripts
  # ---------------------------------------------------------------------------
  shellcheck:
    executor: docker-shellcheck
    steps:
      - checkout
      - run:
          name: Lint shell scripts
          command: find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck

  # ---------------------------------------------------------------------------
  # hadolint — Dockerfile best-practice linter
  # ---------------------------------------------------------------------------
  hadolint:
    executor: docker-hadolint
    steps:
      - checkout
      - run:
          name: Lint Dockerfile
          command: hadolint Dockerfile

  # ---------------------------------------------------------------------------
  # caddy-validate — formatting and syntax check for the Caddyfile
  #
  # caddy fmt exits 1 if the file is not already formatted.
  # Fix locally with: caddy fmt --overwrite caddy/Caddyfile
  # OLLAMA_API_KEY is set to a placeholder so {$OLLAMA_API_KEY} resolves
  # during syntax validation without a real secret.
  # ---------------------------------------------------------------------------
  caddy-validate:
    executor: docker-caddy
    steps:
      - checkout
      - run:
          name: Check Caddyfile formatting
          # Snapshot the original, format in-place, diff against the snapshot.
          # Fix locally with: caddy fmt --overwrite caddy/Caddyfile
          command: |
            cp caddy/Caddyfile /tmp/Caddyfile.orig
            caddy fmt --overwrite caddy/Caddyfile
            if ! diff -u /tmp/Caddyfile.orig caddy/Caddyfile; then
              echo "Caddyfile was not formatted. Run: caddy fmt --overwrite caddy/Caddyfile"
              exit 1
            fi
      - run:
          name: Validate Caddyfile syntax
          command: OLLAMA_API_KEY=ci-placeholder caddy validate --config caddy/Caddyfile
      - run:
          name: Validate Caddyfile syntax with TLS on
          # The environment kube/stack.yml.j2 gives Caddy when llm_tls_hostnames
          # is set.
          command: |
            OLLAMA_API_KEY=ci-placeholder LLM_AUTO_HTTPS=disable_redirects \
              LLM_TLS="tls internal" LLM_SITE_ADDRESS="localhost:8080, llm.lan:8080" \
              caddy validate --config caddy/Caddyfile

  # ---------------------------------------------------------------------------
  # ansible-lint — lint all Ansible playbooks and roles
  # ---------------------------------------------------------------------------
  ansible-lint:
    docker:
      # Pinned instead of :latest — an unpinned floating tag executes whatever
      # image was silently pushed upstream since the last CI run.
      - image: ghcr.io/ansible/community-ansible-dev-tools:v26.7.1
    resource_class: small
    steps:
      - checkout
      - run:
          name: Lint Ansible playbooks
          command: ansible-lint ansible/

  # ---------------------------------------------------------------------------
  # kube-validate — schema-validate Kubernetes YAML with kubeconform
  #
  # Renders kube/stack.yml.j2 for the cpu, rocm and cuda build targets with
  # scripts/render-stack.sh (the same Ansible template engine the playbook
  # uses) and validates each result. caddy-validate checks the Caddyfile the
  # template embeds.
  # ---------------------------------------------------------------------------
  kube-validate:
    executor: docker-alpine
    steps:
      - checkout
      - run:
          # Pinned to a specific release and checksum-verified instead of
          # /releases/latest — an unpinned, unverified binary would execute
          # whatever was most recently pushed upstream with no integrity check.
          name: Install kubeconform and ansible-core
          command: |
            apk add --no-cache curl bash python3 ansible-core
            KUBECONFORM_VERSION=v0.8.0
            KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
            curl -sSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
            tar -xz -C /usr/local/bin kubeconform -f kubeconform-linux-amd64.tar.gz
            rm kubeconform-linux-amd64.tar.gz
      - run:
          name: Render and validate the stack manifest for each build target
          command: |
            for target in cpu rocm cuda; do
              ./scripts/render-stack.sh "${target}" "/tmp/stack-${target}.yml"
            done
            kubeconform -strict -summary /tmp/stack-cpu.yml /tmp/stack-rocm.yml /tmp/stack-cuda.yml

  # ---------------------------------------------------------------------------
  # test-pull-models — model selection of pull-models.sh per hardware profile
  # ---------------------------------------------------------------------------
  test-pull-models:
    executor: docker-alpine
    steps:
      - checkout
      - run:
          name: Install bash
          command: apk add --no-cache bash
      - run:
          name: Check model selection
          command: ./tests/pull-models.sh

  # ---------------------------------------------------------------------------
  # check-spdx — ensure every source file has an SPDX-License-Identifier line
  #
  # Covers: shell scripts, Dockerfile, Caddyfile, Quadlet units, Modelfiles,
  #         Docker Compose files, Kubernetes YAML, Ansible playbooks.
  # LICENSE and LICENSE-CONTENT are data files and are intentionally excluded.
  # ---------------------------------------------------------------------------
  check-spdx:
    executor: docker-alpine
    steps:
      - checkout
      - run:
          name: Check SPDX-License-Identifier headers
          # REUSE-IgnoreStart
          command: |
            rc=0
            for f in \
              scripts/*.sh tests/*.sh Dockerfile caddy/Caddyfile *.container *.network modelfiles/Modelfile.* \
              kube/*.j2 kube/*.kube *.properties \
              $(find ansible -name '*.yml'); do
              [ -f "$f" ] || continue
              if ! grep -q "SPDX-License-Identifier:" "$f"; then
                echo "MISSING SPDX header: $f"
                rc=1
              fi
            done
            exit $rc
          # REUSE-IgnoreEnd

workflows:

  # ---------------------------------------------------------------------------
  # validate-changes — runs on all branches except gh-pages
  # ---------------------------------------------------------------------------
  validate-changes:
    jobs:
      - sonarcloud-scan:
          context:
            - sonarcloud.io
          <<: *ignore-gh-pages
      - shellcheck:
          <<: *ignore-gh-pages
      - hadolint:
          <<: *ignore-gh-pages
      - caddy-validate:
          <<: *ignore-gh-pages
      - ansible-lint:
          <<: *ignore-gh-pages
      - kube-validate:
          <<: *ignore-gh-pages
      - test-pull-models:
          <<: *ignore-gh-pages
      - check-spdx:
          <<: *ignore-gh-pages
